[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuga-arc3"
version = "0.1.0"
description = "CUGA ARC3 rebuild MVP"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
