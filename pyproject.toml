[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuga-arc3-rebuild"
version = "0.1.0"
description = "CUGA ARC3 rebuild MVP"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "streamlit>=1.44.0",
]

[project.scripts]
cuga-arc3 = "cuga_arc3.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Run e2e-only suite: uv run pytest tests/e2e/ -v -m e2e
markers = ["e2e: end-to-end regression tests", "unit: unit tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/cuga_arc3"]
